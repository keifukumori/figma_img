<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>c-staff-education</title>
<style>
.c-staff-education{display:flex;align-items:flex-start;gap:40px;margin:60px 0;}
.c-staff-education__image img{width:100%;max-width:480px;height:auto;display:block;}
.c-staff-education__content{display:flex;flex-direction:column;gap:24px;font-family:"Noto Sans JP",sans-serif;color:#212121;}
.c-staff-education__headline{font-weight:600;font-size:20px;line-height:32px;margin:0;}
.c-staff-education__phrases{display:flex;flex-direction:column;gap:6px;}
.c-staff-education__phrase{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;}
.c-staff-education__bg{background-color:#F8F3ED;width:100%;height:40px;position:absolute;top:50%;left:0;transform:translateY(-50%);z-index:0;}
.c-staff-education__text{position:relative;z-index:1;font-weight:600;font-size:20px;line-height:32px;margin:0;}
.c-staff-education__desc{font-weight:400;font-size:16px;line-height:25.6px;margin:0;}
</style>
</head>
<body>
<section class="c-staff-education">
  <div class="c-staff-education__image">
    <img src="path/to/image.jpg" alt="スタッフ教育の様子" />
  </div>
  <div class="c-staff-education__content">
    <h2 class="c-staff-education__headline">お客様に「安心」して通っていただけるよう、常にスタッフの教育を行なっております。</h2>
    <div class="c-staff-education__phrases">
      <div class="c-staff-education__phrase">
        <div class="c-staff-education__bg"></div>
        <p class="c-staff-education__text">お客様に「安心」して通っていただけるよう、</p>
      </div>
      <div class="c-staff-education__phrase">
        <div class="c-staff-education__bg"></div>
        <p class="c-staff-education__text">常にスタッフの教育を行なっています。</p>
      </div>
    </div>
    <p class="c-staff-education__desc">MEN&#x27;S TBCでは自社の教育、研修制度だけではなく、AEA認定エステティシャン資格・CPE・認定美容脱毛エステティシャン資格等、さまざまな美容関連の資格及び公的資格等の取得を奨励しています。</p>
  </div>
</section>
</body>
</html>
